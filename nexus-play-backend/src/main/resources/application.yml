server:
  port: 8485

spring:
  application:
    name: nexus-play-backend
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:dev}"
    
app:
  jwt:
    secret: "${APP_CHAVE_SECRETA_JWT}"
    expiracao-ms: 3600000    # 1 hora duracao do token

rawg:
  url: https://api.rawg.io/api
  api-key: "${RAWG_API_KEY}"
